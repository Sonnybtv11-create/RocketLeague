<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TURBO PITCH</title>
<!--HEADER_COMMENT-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070d; }
  #game-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; outline: none; }
  #ui-root { position: fixed; inset: 0; pointer-events: none; user-select: none; -webkit-user-select: none; }
  #ui-root * { box-sizing: border-box; }
  #boot-error { position: fixed; left: 16px; bottom: 16px; color: #f88; font: 13px monospace; white-space: pre-wrap; z-index: 99; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "__THREE_URL__",
    "three/addons/": "__THREE_ADDONS_URL__"
  }
}
</script>
</head>
<body>
<canvas id="game-canvas" tabindex="0"></canvas>
<div id="ui-root"></div>
<div id="boot-error"></div>
<script>
  window.addEventListener('error', (e) => { const el = document.getElementById('boot-error'); if (el) el.textContent += (e.message || e) + '\n'; });
  window.addEventListener('unhandledrejection', (e) => { const el = document.getElementById('boot-error'); if (el) el.textContent += 'Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason) + '\n'; });
</script>
<!--MAIN_SCRIPT-->
</body>
</html>
