<!--
TURBO PITCH — a single-file car-soccer game with Rocket-League-accurate physics.
Original title, cars, arena, sounds and UI; all assets are generated in code.
Only external dependency: Three.js r186 (ES module from jsDelivr via the import map).

CONTROLS (all remappable in Settings > Bindings; saved in localStorage)
  Keyboard & mouse            Gamepad (standard mapping)
  W / S   throttle / reverse   RT / LT   throttle / reverse
  A / D   steer, air yaw        Left stick  steer / pitch / yaw
  Arrows  air pitch / yaw       A          jump
  Right mouse  jump             B          boost
  Left mouse   boost            X          powerslide / air roll
  Left Shift   powerslide / free air roll (A/D roll while held)
  Q / E   air roll left/right   LB / RB    air roll left / right
  Space   ball cam              Y          ball cam
  Tab     scoreboard            Back/View  scoreboard
  R       reset ball (free play) D-pad up  reset ball (free play)
  Esc     pause                 Start      pause
  F3      debug overlay + physics self-tests
  Right stick / mouse (when enabled): free look

PHYSICS SOURCES
  * RocketSim by ZealanL (github.com/ZealanL/RocketSim, MIT License, (c) 2022 ZealanL):
    RLConst.h, Car.cpp, CarConfig.cpp, Ball.cpp, Arena.cpp, BoostPad.cpp and btVehicleRL.cpp
    were ported to JavaScript line by line (constants, curves, suspension, wheel friction
    impulses, sticky forces, jump/dodge/air control, auto-flip/roll, boost, supersonic,
    extra car->ball impulse, bump/demo rules, pad pickup volumes, kickoff/respawn spawns).
  * Bullet 3.24 as modified by RocketSim: sequential-impulse contact solver (10 iterations,
    split impulse with erp2 0.8, restitution threshold 0.2 bt/s, static friction=min /
    restitution=max combine rules).
  * RLBot / RLGym "useful game values" tables (arena dimensions, pad and spawn positions).
  Units: Unreal Units (1 uu = 1 cm), Z-up, fixed 120 Hz; render converts to Three.js (Y-up, m).

KEY CONSTANTS (see src/sim/const.js in the repository)
  gravity -650; ball r 91.25, mass 30, drag 0.03, max 6000 uu/s, world friction/restitution
  0.35/0.6; car mass 180, max 2300 uu/s, 5.5 rad/s; supersonic 2200 (2100 maintain, 1 s);
  boost 33.33/s, accel 991.67 ground / 1058.33 air; throttle 1600 uu/s^2 to 1410;
  brake 3500, coast 525; jump 291.67 + 1458.33 hold (0.025-0.2 s); dodge 500 (2.5x back,
  1.9x side); flip torque 260/224 for 0.65 s; air torque (130,95,400)*2pi/65536*1000.

VERIFICATION
  * The physics was compared tick-by-tick against a compiled RocketSim library on identical
    arena geometry: ball hits (1400/2300 uu/s -> 1925/3043 vs 1923/3037), bumps, jump heights
    (89.2 / 231.8 / 488.3 uu), ball bounces/rolling and flip impulses match to <0.5%.
  * In-game self-tests (F3 -> Run self-tests): 30 checks covering the spec's phase 1-5 numbers.

VALUES THAT COULD NOT BE VERIFIED AGAINST THE REAL GAME
  * Ball speed from a 1400 uu/s straight hit: spec says ~2500-2800 [verify]; RocketSim's model
    (which we follow) gives ~1925 uu/s.
  * Arena curvature: floor/ceiling transition radius 256, vertical corner rounding 200 uu, and
    the goal interior shape are approximations (no ripped collision meshes are used).
  * Points table uses the current published values (goal 100, assist 50, save 50, epic save 75,
    shot 10, clear 20, centre 10; demo / aerial hit / first touch award 0 points) instead of the
    spec's [verify] list; legacy values are kept in src/game/match/rules.js.
  * Clock: waits for the first touch after a kickoff (per RLBot docs) but starts anyway after
    5 s without a touch (the exact fallback time is a guess).
  * Goal blast strength (radius 1500, up to 2000 uu/s), 3 s celebration, replay length
    (6 s before + 1.25 s after), assist window (5 s) and shot/save/epic-save thresholds.
  * Camera defaults are the spec's (FOV 110, distance 270, height 100, angle -4, stiffness 0.45,
    swivel 5, transition 1.2); stock game defaults differ (FOV 90, angle -3). Stiffness and
    ball-cam framing are modelled from community descriptions.
  * Deliberate deviation: a demolition does not slow the attacker (RocketSim resolves that
    contact; the real game lets the attacker pass through).

-->

            bestN = h2.n;
            bestBody = oc.body;

          }

          w.contactNormal = bestN;
          w.isInContact = true;
          w.isWorld = isWorld;
          w.groundBody = bestBody;

          if (denom > 0.1) {

            w.suspRelVel = projVel * inv;
            w.clippedInv = inv;
          } else {
            w.suspRelVel = 0;
            w.clippedInv = 10;
          }
          if (isWorld) {
            const thresh = restLen + w.def.radius - SUSPENSION_SUBTRACTION;
            if (traceLen < thresh) {

              const relVel = bestN.dot(velAt);
              const posErr = SOLVER_ERP * -dist2 / TICK_TIME;
              const velErr = -relVel;
              const den = b.impulseDenom(relpos, bestN);

              if (imp < 0) imp = 0;
              w.extraPushback = imp / 4;

      _calcFrictionImpulses(dt) {

            continue;

          const n = w.contactNormal;
          let axle = w.wRight;
          axle = axle.sub(n.mul(axle.dot(n))).normalized();

          const velA = b.velAt(relA);

            velB = g.velAt(relB);
            denB = g.impulseDenom(relB, axle);

          const jac = b.impulseDenom(relA, axle) + denB;
          const relVelSide = axle.dot(velA.sub(velB));

      _upwardsDirFromWheelContacts() {

          if (this.isDemoed) return;
        }

        c.throttle = clamp1(c.throttle);
        c.steer = clamp1(c.steer);
        c.pitch = clamp1(c.pitch);
        c.yaw = clamp1(c.yaw);
        c.roll = clamp1(c.roll);
        const b = this.body;

        let numWheels = 0;

          numWheels += this.wheels[i].isInContact ? 1 : 0;

        const wasOnGround = this.isOnGround;
        const prevWheels = this.numWheelsInContact;
        this.isOnGround = numWheels >= 3;
        this.numWheelsInContact = numWheels;

          this.lastLandTick = world.tick;
          ev.push({ type: EV.LAND, carId: this.id, speed: Math.abs(b.vel.dot(this._upwardsDirFromWheelContacts())), pos: b.pos.clone() });

        if (numWheels < 3) this._updateAirTorque(dt, numWheels === 0);

      _updateWheels(dt, numWheels, forwardSpeed) {

        let wheelsHaveWorldContact = false;
        for (const w of this.wheels) wheelsHaveWorldContact = wheelsHaveWorldContact || w.isInContact && w.isWorld;

        let realBrake = 0;

          let engineThrottle = realThrottle;
          if (c.handbrake) {
          } else {
            const absThrottle = Math.abs(realThrottle);
            if (absThrottle >= THROTTLE_DEADZONE) {

          const brakeForce = realBrake * BRAKE_TORQUE_AMOUNT;

            w.brake = brakeForce;

        {

          const wheelDelta = w.hardPoint.sub(b.pos);

          let longFriction = LONG_FRICTION_CURVE.get(frictionCurveInput);

          w.longFriction = longFriction;

      }
      _updateBoost(dt, ev, world) {
        const c = this.controls, b = this.body;
        const wasBoosting = this.isBoosting;
        if (world.unlimitedBoost && !this.isBot) this.boost = 100;
        if (this.boost > 0) {
          if (this.isBoosting) this.isBoosting = c.boost || this.boostingTime < F(BOOST_MIN_TIME);
          else if (c.boost) this.isBoosting = true;
        } else this.isBoosting = false;

      _updateJump(dt, jumpPressed, ev) {

      _updateAirTorque(dt, updateAirControl) {

                if (Math.abs(dodgeDir.y) < 0.1) dodgeDir.y = 0;
                if (Math.abs(dodgeDir.x) > 1e-6 || Math.abs(dodgeDir.y) > 1e-6) {

                  else backwards = dodgeDir.x >= 0 !== forwardSpeed >= 0;
                  const init = dodgeDir.mul(FLIP_INITIAL_VEL_SCALE);
                  const maxSpeedScaleX = backwards ? FLIP_BACKWARD_IMPULSE_MAX_SPEED_SCALE : FLIP_FORWARD_IMPULSE_MAX_SPEED_SCALE;
                  init.x *= (maxSpeedScaleX - 1) * forwardSpeedRatio + 1;
                  init.y *= (FLIP_SIDE_IMPULSE_MAX_SPEED_SCALE - 1) * forwardSpeedRatio + 1;
                  if (backwards) init.x *= FLIP_BACKWARD_IMPULSE_SCALE_X;
                  const f2 = b.rot.forward.to2D().normalized();
                  const r2 = new Vec3(-f2.y, f2.x, 0);
                  const dv = f2.mul(init.x).add(r2.mul(init.y));
                  b.applyCentralImpulse(dv.mul(CAR_MASS));
                }
                ev.push({ type: EV.DODGE, carId: this.id, dir: { x: dodgeDir.x, y: dodgeDir.y }, pos: b.pos.clone() });

                b.applyCentralImpulse(b.rot.up.mul(JUMP_IMMEDIATE_FORCE * CAR_MASS));

                ev.push({ type: EV.DOUBLE_JUMP, carId: this.id, pos: b.pos.clone() });
              }
            }
          }
        }
        if (this.isFlipping) {
          this.flipTime = addT(this.flipTime, dt);
          if (this.flipTime <= F(FLIP_TORQUE_TIME)) {
            if (this.flipTime >= F(FLIP_Z_DAMP_START) && (b.vel.z < 0 || this.flipTime < F(FLIP_Z_DAMP_END))) {

        }
      }
      _updateAutoFlip(dt, jumpPressed) {
        const b = this.body;
        if (jumpPressed && this.worldContact.hasContact && this.worldContact.normal.z > CAR_AUTOFLIP_NORMZ_THRESH) {
          const ang = yprFromRotMat(b.rot);
          const absRoll = Math.abs(ang.roll);
          if (absRoll > CAR_AUTOFLIP_ROLL_THRESH) {
            this.autoFlipTimer = f32(CAR_AUTOFLIP_TIME * (absRoll / Math.PI));
            this.autoFlipTorqueScale = ang.roll > 0 ? 1 : -1;
            this.isAutoFlipping = true;
            b.applyCentralImpulse(b.rot.up.mul(-CAR_AUTOFLIP_IMPULSE * CAR_MASS));
          }
        }
        if (this.isAutoFlipping) {
          if (this.autoFlipTimer <= 0) {
            this.isAutoFlipping = false;
            this.autoFlipTimer = 0;
          } else {
            b.angVel.addSelf(b.rot.forward.mul(CAR_AUTOFLIP_TORQUE * this.autoFlipTorqueScale * dt));
            this.autoFlipTimer = subT(this.autoFlipTimer, dt);
          }
        }
      }
      _updateAutoRoll(dt, numWheels) {
        const b = this.body;
        const groundUp = numWheels > 0 ? this._upwardsDirFromWheelContacts() : this.worldContact.normal;
        const groundDown = groundUp.neg();
        const f = b.rot.forward, r = b.rot.right;
        const crossRight = groundUp.cross(f);
        const crossForward = groundDown.cross(crossRight);
        const rightTorqueFactor = 1 - clamp(r.dot(crossRight), 0, 1);
        const forwardTorqueFactor = 1 - clamp(f.dot(crossForward), 0, 1);
        const torqueDirRight = f.mul(r.dot(groundUp) >= 0 ? -1 : 1);
        const torqueDirForward = r.mul(f.dot(groundUp) >= 0 ? 1 : -1);
        const torque = torqueDirForward.mul(forwardTorqueFactor).add(torqueDirRight.mul(rightTorqueFactor));
        b.applyCentralForce(groundDown.mul(CAR_AUTOROLL_FORCE * CAR_MASS));
        b.angVel.addSelf(torque.mul(CAR_AUTOROLL_TORQUE * dt));
      }
      // -------------------------------------------------------------- post tick
      postTick(world, dt) {
        if (this.isDemoed) return;
        const b = this.body;
        const speed2 = b.vel.len2();
        const wasSS = this.isSupersonic;
        if (this.isSupersonic && this.supersonicTime < F(SUPERSONIC_MAINTAIN_MAX_TIME))
          this.isSupersonic = speed2 >= SUPERSONIC_MAINTAIN_MIN_SPEED ** 2;
        else this.isSupersonic = speed2 >= SUPERSONIC_START_SPEED ** 2;
        if (this.isSupersonic) this.supersonicTime = addT(this.supersonicTime, dt);
        else this.supersonicTime = 0;
        if (this.isSupersonic && !wasSS) world.events.push({ type: EV.SUPERSONIC_START, carId: this.id });
        if (this.carContact.cooldownTimer > 0) this.carContact.cooldownTimer = Math.max(subT(this.carContact.cooldownTimer, dt), 0);
        this.lastControls = { ...this.controls };
      }
      finishTick() {
        if (this.isDemoed) return;
        const b = this.body;
        if (!b.velCache.isZero()) {
          b.vel.addSelf(b.velCache);
          b.velCache.set(0, 0, 0);
        }
        const v2 = b.vel.len2();
        if (v2 > CAR_MAX_SPEED ** 2) b.vel.mulSelf(CAR_MAX_SPEED / Math.sqrt(v2));
        const w2 = b.angVel.len2();
        if (w2 > CAR_MAX_ANG_SPEED ** 2) b.angVel.mulSelf(CAR_MAX_ANG_SPEED / Math.sqrt(w2));
      }
      // Convenience for bots / UI
      hasFlipOrJump() {
        return this.isOnGround || !this.hasFlipped && !this.hasDoubleJumped && this.airTimeSinceJump < F(DOUBLEJUMP_MAX_DELAY);
      }
      hasFlipReset() {
        return !this.isOnGround && this.hasFlipOrJump() && !this.hasJumped;
      }
    };
  }
});

// src/sim/ball.js
function stepBallAlone(ball, dt) {
  const b = ball.body;
  if (b.vel.len2() === 0 && b.angVel.len2() === 0) return;
  b.preVel = b.vel.clone();
  b.preAng = b.angVel.clone();

function lerpV(a, b, t) {
  return new Vec3(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t, a.z + (b.z - a.z) * t);
}
function matToQuat(m) {
  const a = m.m;
  const tr = a[0] + a[4] + a[8];
  let w, x, y, z;
  if (tr > 0) {
    const s2 = Math.sqrt(tr + 1) * 2;
    w = 0.25 * s2;
    x = (a[7] - a[5]) / s2;
    y = (a[2] - a[6]) / s2;
    z = (a[3] - a[1]) / s2;
  } else if (a[0] > a[4] && a[0] > a[8]) {
    const s2 = Math.sqrt(1 + a[0] - a[4] - a[8]) * 2;
    w = (a[7] - a[5]) / s2;
    x = 0.25 * s2;
    y = (a[1] + a[3]) / s2;
    z = (a[2] + a[6]) / s2;
  } else if (a[4] > a[8]) {
    const s2 = Math.sqrt(1 + a[4] - a[0] - a[8]) * 2;
    w = (a[2] - a[6]) / s2;
    x = (a[1] + a[3]) / s2;
    y = 0.25 * s2;
    z = (a[5] + a[7]) / s2;
  } else {
    const s2 = Math.sqrt(1 + a[8] - a[0] - a[4]) * 2;
    w = (a[3] - a[1]) / s2;
    x = (a[2] + a[6]) / s2;
    y = (a[5] + a[7]) / s2;
    z = 0.25 * s2;
  }
  return [x, y, z, w];
}
function quatToMat(q) {
  const [x, y, z, w] = q;
  return new RotMat([
    1 - 2 * (y * y + z * z),
    2 * (x * y - z * w),
    2 * (x * z + y * w),
    2 * (x * y + z * w),
    1 - 2 * (x * x + z * z),
    2 * (y * z - x * w),
    2 * (x * z - y * w),
    2 * (y * z + x * w),
    1 - 2 * (x * x + y * y)

}
function slerpRot(ma, mb, t) {
  const a = matToQuat(ma), b = matToQuat(mb);
  let d = a[0] * b[0] + a[1] * b[1] + a[2] * b[2] + a[3] * b[3];
  if (d < 0) {
    b[0] = -b[0];
    b[1] = -b[1];
    b[2] = -b[2];
    b[3] = -b[3];
    d = -d;
  }
  let q;
  if (d > 0.9995) q = a.map((v, i) => v + (b[i] - v) * t);
  else {

    const wa = Math.sin((1 - t) * th) / s2, wb = Math.sin(t * th) / s2;
    q = a.map((v, i) => v * wa + b[i] * wb);
  }

}

      hitbox: c.hitbox,

      pos: c.body.pos.clone(),
      vel: c.body.vel.clone(),
      angVel: c.body.angVel.clone(),

  if (!a) a = b;

    tick: b.tick,
    time: a.time + (b.time - a.time) * t,
    isReplay: false,
    ball: {
      pos: lerpV(a.ball.pos, b.ball.pos, t),
      vel: lerpV(a.ball.vel, b.ball.vel, t),
      angVel: b.ball.angVel,
      rot: slerpRot(a.ball.rot, b.ball.rot, t)
    },
    cars: [],
    pads: b.pads,
    match: null
  };
  for (const cb of b.cars) {
    const ca = a.cars.find((c) => c.id === cb.id) || cb;
    const teleport = ca.pos.dist(cb.pos) > 400 || ca.isDemoed !== cb.isDemoed;
    const tt = teleport ? 1 : t;
    const rot = slerpRot(ca.rot, cb.rot, tt);
    view.cars.push({
      ...cb,
      pos: lerpV(ca.pos, cb.pos, tt),
      vel: lerpV(ca.vel, cb.vel, tt),
      rot,
      forward: rot.forward,
      right: rot.right,
      up: rot.up,
      boost: ca.boost + (cb.boost - ca.boost) * tt,
      wheels: cb.wheels.map((w, i) => ({
        ...w,
        suspLen: ca.wheels[i].suspLen + (w.suspLen - ca.wheels[i].suspLen) * tt,
        spin: ca.wheels[i].spin + (w.spin - ca.wheels[i].spin) * tt
      }))
    });
  }
  if (a.ball.pos.dist(b.ball.pos) > 600) view.ball.pos = b.ball.pos.clone();
  return view;
}

}

/* ================================================================ HUD */

  background: linear-gradient(90deg, rgba(47,123,255,.9), rgba(7,10,20,.92) 30%, rgba(7,10,20,.92) 70%, rgba(255,138,31,.9));
  clip-path: polygon(0 0, 100% 0, calc(100% - calc(var(--u) * 2)) 100%, calc(var(--u) * 2) 100%); }

/* boost meter */

/* event feed */
.tp-feed { position: absolute; top: calc(var(--u) * 2.2); right: calc(var(--u) * 2.2); display: flex; flex-direction: column; align-items: flex-end; gap: calc(var(--u) * 0.6); }

/* points pop-ups */
.tp-pops { position: absolute; right: calc(var(--u) * 30); top: 50%; display: flex; flex-direction: column; align-items: flex-end; gap: calc(var(--u) * 0.5); }

/* countdown */

  text-shadow: 0 0 calc(var(--u) * 2.2) rgba(255, 190, 60, 0.8), 0 calc(var(--u) * 0.3) calc(var(--u) * 0.8) rgba(0,0,0,.65); }

  text-shadow: 0 0 calc(var(--u) * 2.5) rgba(255, 210, 90, 0.95), 0 0 calc(var(--u) * 0.4) rgba(0,0,0,.6); }

  100% { opacity: 1; transform: translate(-50%, -50%) scale(0.94); } }

  60% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); } }

/* goal banner */
.tp-goal { position: absolute; left: 0; right: 0; top: 19%; display: flex; flex-direction: column; align-items: center; animation: tp-goal-in 0.45s cubic-bezier(.2,1.4,.4,1); }

.tp-goal-band.t0 { background: linear-gradient(90deg, rgba(47,123,255,0), rgba(47,123,255,.92) 22%, rgba(31,72,200,.95) 78%, rgba(47,123,255,0)); }
.tp-goal-band.t1 { background: linear-gradient(90deg, rgba(255,138,31,0), rgba(255,138,31,.92) 22%, rgba(214,90,10,.95) 78%, rgba(255,138,31,0)); }
.tp-goal-title { transform: skewX(14deg); font-size: calc(var(--u) * 9); font-weight: 800; font-style: italic; letter-spacing: 0.04em; color: #fff; line-height: 1.05;
  text-shadow: 0 calc(var(--u) * 0.3) calc(var(--u) * 1) rgba(0, 0, 0, 0.45); white-space: nowrap; }
.tp-goal-sub { margin-top: calc(var(--u) * 1.2); display: flex; gap: calc(var(--u) * 2.5); align-items: baseline; padding: calc(var(--u) * 0.6) calc(var(--u) * 3);
  background: rgba(6, 10, 22, 0.8); font-size: calc(var(--u) * 2.6); text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }

.tp-replay-tag .dot { width: calc(var(--u) * 1.6); height: calc(var(--u) * 1.6); border-radius: 50%; background: #ff3b2a; box-shadow: 0 0 calc(var(--u) * 1) #ff3b2a; animation: tp-blink 1s steps(2, start) infinite; }

/* ball cam + free play hints */
.tp-ballcam { position: absolute; left: calc(var(--u) * 4.5); bottom: calc(var(--u) * 3.5); }

      c.boost = Math.abs(ang) < 0.3 && car.forwardSpeed < 2200 && remT > 0.4;

        this.maneuver = new Flip(lb2.x, lb2.y, { jumpTicks: 3, gap: 1, name: "wallDodge" });

    const cx = b.x - sdx * off, cy = b.y - sdy * off;
    const d = hyp(cx - p.x, cy - p.y);
    const vf0 = Math.max(car.forwardSpeed, 0);
    const r = turnRadius(clamp6(Math.max(vf0, 1e3), 900, 1700)) * APPROACH_R;
    const ap = approachPath(p.x, p.y, cx, cy, sdx, sdy, r);

      lb.y = localTarget(car, bh).y;

        this.maneuver = new Flip(lb.x, lb.y, { jumpTicks: 2, gap: 1, name: "dodgeShot" });

      return;
    }

    const need = b.z - 17 - 75;

  }
  // the opponent closest to the ball is moving it toward our half
  oppComingAtUs(world) {
    const id = this.co.oppFirst[this.team];
    const o = id >= 0 ? world.getCar(id) : null;
    if (!o) return false;
    const ball = this.ballNow();
    return (ball.y - o.body.pos.y) * this.s < 200 && o.body.vel.y * this.s < 300;
  }
  rollDodge(world) {
    if (this.skill.dodgeShots >= 1) return true;
    if (world.tick - this._dodgeRollTick > 90) {
      this._dodgeRollTick = world.tick;
      this._dodgeRoll = this.rng() < this.skill.dodgeShots;
    }
    return this._dodgeRoll;
  }
  // Already in the air (after a jump/flip that ended, falling off a wall...):
  // all-stars can chain into an aerial when one is feasible.
  tryAirShot(car, c, world) {
    if (!this.skill.aerials || this.skill.name !== "allstar" || car.boost < 15) return false;
    if (car.body.pos.z < 250) return false;
    const ic = this.refreshIntercept(world, car, false);
    if (!ic || ic.kind !== "aerial") return false;
    const sdx = ic.sdx, sdy = ic.sdy;
    const tgt2 = (T3) => {
      const bb = this.ballAt(T3);
      return { x: bb.x - sdx * 70, y: bb.y - sdy * 70, z: bb.z - 25 };
    };
    this.maneuver = new Aerial(ic.tick, tgt2, { dbl: false, dodge: true });
    this.stats.aerials++;
    this.aerialStart = world.tick;
    this.maneuver.step(this, car, c, world);
    return true;
  }
  // ---------------------------------------------------------------- positioning
  support(car, c, world) {
    const s2 = this.s;
    const ball = this.ballNow();
    const firstId = this.co.first[this.team];
    const first = firstId >= 0 ? world.getCar(firstId) : null;
    const ownY = -FIELD_Y * s2;
    let tx, ty;
    const back = ball.y * s2 < -1e3 ? 1500 : 2300;
    ty = ball.y - s2 * back;
    const fx = first ? first.body.pos.x : ball.x;
    tx = clamp6(ball.x * 0.35 + (fx > ball.x ? -1 : 1) * 900, -2600, 2600);

  goalie(car, c, world) {

    const ball = this.ballNow();
    const ownY = -FIELD_Y * s2;
    const dGoal = hyp(ball.x, ball.y - ownY);
    const k = clamp6(1200 / Math.max(dGoal, 1), 0.12, 0.45);
    let tx = ball.x * k, ty = ownY + (ball.y - ownY) * k;

  // 1v1 / last man: stay between ball and goal at a distance matching the ball pace
  shadow(car, c, world) {

    const ball = this.ballNow();
    const ownY = -FIELD_Y * s2;

    let dx = gx - ball.x, dy = ownY - ball.y;
    const l = hyp(dx, dy) || 1;
    dx /= l;
    dy /= l;

    const tx = ball.x + dx * D, ty = ball.y + dy * D;

    this.position(car, c, world, tx, ty, ball, bv);
  }
  // Back-post rotation: drive to the post away from the ball, then face the play.
  backPost(car, c, world, urgent) {
    const s2 = this.s;
    const ball = this.ballNow();
    const ownY = -FIELD_Y * s2;
    const p = car.body.pos;
    const far = ball.x >= 0 ? -1 : 1;
    let tx = far * (GOAL_HW - 50), ty = ownY + s2 * 350;
    if ((p.y - ownY) * s2 < 900) {

      ty = ownY + s2 * 200;

  }
  goalLine(car, c, world) {
    const s2 = this.s;
    const ownY = -FIELD_Y * s2;
    let cx = 0;
    for (let i = 0; i < this.traj.n; i += 2) {
      if (this.traj.py(i) * s2 < -(FIELD_Y - 50)) {
        cx = this.traj.px(i);

    const p = car.body.pos;
    const tx = clamp6(cx, -GOAL_HW + 100, GOAL_HW - 100), ty = ownY + s2 * 120;

      c.throttle = 0.4;
      if (car.isOnGround && car.body.rot.m[8] > 0.9) this.settledTick = world.tick;

      if (this.skill.jumpShots && db2 < 500 && ball.z > 150 && car.isOnGround) {

  }
  // Arrive at (tx, ty) and settle facing `face` (a point); optional pace matching
  position(car, c, world, tx, ty, face, paceVel) {
    const p = car.body.pos;
    const T3 = clampToField({ x: tx, y: ty, z: 0 }, 200);
    const d = hyp(T3.x - p.x, T3.y - p.y);
    if (d > 250) {
      let speed = Math.min(2300, Math.sqrt(2 * 2200 * Math.max(d - 150, 0)) + 200);

    }
    if (car.isOnGround && car.body.rot.m[8] > 0.9) this.settledTick = world.tick;

    const ang = Math.atan2(loc.y, loc.x);

      c.steer = steerPD(car, ang);
      return;
    }
    c.throttle = car.forwardSpeed < 400 ? 0.6 : 0.1;
    c.steer = ang > 0 ? 1 : -1;
    if (Math.abs(ang) > 2 && car.forwardSpeed > 250) c.handbrake = true;

  // Pick up a boost pad on the way when low
  maybePads(car, c, world, tx, ty, threshold, attacking = false) {

      const ball = this.ballNow();

        const d1 = hyp(pad2.pos.x - p.x, pad2.pos.y - p.y);
        const arrive = d1 / 1600;

  }
  // Demolition attempt (all-star): only when fast, opponent ahead & grounded
  tryDemo(car, c, world, myEta) {

        this.demoUntil = now2 + 180;
        this.stats.demoAttempts++;

      }
      if (this.demoTarget < 0) return false;
    }
    const o = world.getCar(this.demoTarget);
    if (!o || o.isDemoed) {
      this.demoTarget = -1;
      return false;
    }

    c.boost = car.boost > 0 && car.forwardSpeed < 2290;

  }
  // ---------------------------------------------------------------- driving
  // Ground driving toward a point with a target speed (uu/s).
  driveTo(car, c, tx, ty, tz, o) {

        ty = gy * (FIELD_Y - 500);

    return false;
  }
  antiStuck(car, c, world) {
    const v = car.body.vel;
    const speed = hyp3(v.x, v.y, v.z);

    if (pushing && speed < 120) this.stuckT += 1 / 120;
    else this.stuckT = Math.max(0, this.stuckT - 2 / 120);

  }

  watchdog(car, world) {
    if (world.tick % 30 !== 0) return;
    const h2 = this.posHist;
    const p = car.body.pos;
    h2.push(p.x, p.y, p.z);
    if (h2.length > 18) h2.splice(0, 3);
    if (h2.length < 18) return;
    const d = hyp3(p.x - h2[0], p.y - h2[1], p.z - h2[2]);
    const settled = world.tick - this.settledTick < 90;
    if (d < 90 && !settled) {
      h2.length = 0;
      this.escape(car, false, 0, "watchdog");
    }
  }
  escape(car, wasReversing, steer, why = "push") {
    this.stats.unstucks++;

    const onWheels = car.isOnGround && car.body.rot.m[8] > 0.5;

  }
};

  return new Bot(opts || {});
}

function frame(now2) {

    const R = MENU_CAM_DIST, cx = Math.cos(t), cy = Math.sin(t);

    camOpts = { mode: "fixed", fixed: { fov: 38, pos: { x: car.pos.x + cx * R, y: car.pos.y + cy * R, z: 118 }, target: { x: tx, y: ty, z: 34 } } };

    } else if (game.lan === "client") {
      view = netView ? netView.view : interpolateFrames(game.prevFrame, game.curFrame, 1);
      camOpts = { mode: "car", targetCarId: game.playerCarId, ballCam: input.isBallCam(), look: input.getLook() };
    } else {
      view = interpolateFrames(game.prevFrame, game.curFrame, Math.min(game.acc / TICK_TIME, 1));
      camOpts = { mode: game.playerCarId >= 0 ? "car" : "spectator", targetCarId: game.playerCarId, ballCam: input.isBallCam(), look: input.getLook() };
    }
  }
  view.match = game.match ? game.match.getView() : null;
  view.hideNameplates = game.mode === "menu" || game.paused || scoreboardOpen || !!(ui.isMenuOpen && ui.isMenuOpen()) || !!(view.match && view.match.state === "ended");
  if (params2.has("cam")) {
    const c = params2.get("cam").split(",").map(Number);
    camOpts = { mode: "fixed", fixed: { pos: { x: c[0], y: c[1], z: c[2] }, target: { x: c[3], y: c[4], z: c[5] } } };
  }
  safe("env", () => env.update(view, dt));
  safe("ball", () => ballModel.update(view.ball, dt, view));
  safe("cars", () => {
    for (const cv of view.cars) {
      const m = carModels.get(cv.id);
      if (m) m.update(cv, dt, view);
    }

  const evs = frameEvents.splice(0);
  if (game.lan === "host" && game.net) safe("net", () => hostSend(evs, replay, now2));
  safe("vfx.events", () => vfx.onEvents(evs, view));
  safe("camera", () => camCtl.update(view, camOpts, dt));
  safe("vfx", () => vfx.update(view, dt, camera));
  safe("prediction", updatePrediction);
  const pc = view.cars.find((c) => c.id === game.playerCarId);
  safe("audio.events", () => audio.onEvents(evs, view));
  safe("audio", () => audio.update(view, { pos: camera.position, quaternion: camera.quaternion, playerCarId: game.playerCarId, camera }, dt));
  safe("ui.events", () => ui.onEvents(evs, view));
  safe("ui", () => ui.update(view, dt, { fps, playerCarId: game.playerCarId, tick: w.tick, ballCam: input.isBallCam(), inputDevice: input.lastDevice, mode: game.mode, paused: game.paused, playerCar: pc, world: w, lan: game.lan }));
  game.fps = fps;
  for (const e of evs) {
    if (e.type === EV.MATCH_END) onMatchEnd(e);
    if ((e.type === EV.DEMO || e.type === EV.GOAL) && settings.camera.shake) camCtl.shake(e.type === EV.GOAL ? 1 : 0.6);
  }
  safe("post", () => post.render());
}
function onMatchEnd(e) {
  const mv = game.match.getView();
  const me = mv.players && mv.players.find((p) => p.carId === game.playerCarId);
  stats.matches++;
  if (me) {
    if (mv.winner === me.team) stats.wins++;
    stats.goals += me.goals || 0;
    stats.assists += me.assists || 0;
    stats.saves += me.saves || 0;
    stats.shots += me.shots || 0;
    stats.demos += me.demos || 0;

document.title = GAME_TITLE;
menuScene();
var scen = params2.get("scene");
if (scen === "kickoff" || scen === "match") newSession({ teamSize: Number(params2.get("size") || 3), difficulty: params2.get("diff") || "allstar", playerTeam: 0 }, "exhibition");
else if (scen === "freeplay") api.startFreePlay({});
else if (scen === "spectate") newSession({ teamSize: Number(params2.get("size") || 3), difficulty: params2.get("diff") || "allstar", spectate: true }, "exhibition");

if (params2.get("advance") && game.world) {
  const n = Math.round(Number(params2.get("advance")) * 120);

}
if (params2.has("debug")) {

  ui.setDebug && ui.setDebug(true);
}
requestAnimationFrame((t) => {

  frame(t);
});
(async () => {

  }
